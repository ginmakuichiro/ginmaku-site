<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>楽屋 - 銀幕一楼とTIMECAFE</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #1a1720;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", monospace, sans-serif;
    touch-action: none;
  }
  #game-wrap {
    position: relative;
    width: min(96vw, 960px);
  }
  canvas {
    display: block;
    width: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    border: 3px solid #3a3442;
    border-radius: 4px;
  }
  #hint {
    color: #b8c2c8;
    font-size: 12px;
    text-align: center;
    margin-top: 8px;
    line-height: 1.6;
  }
  /* モバイル用コントローラ */
  #pad {
    display: none;
    margin-top: 12px;
    width: min(96vw, 960px);
    justify-content: space-between;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
  }
  #dpad {
    display: grid;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 52px);
    gap: 2px;
  }
  .pbtn {
    background: #3a3442;
    color: #dde4e8;
    border: none;
    border-radius: 8px;
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .pbtn:active { background: #c0392b; }
  #btnA {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: #c0392b;
    color: #fff;
    border: none;
    font-size: 18px;
    font-weight: bold;
  }
  #btnA:active { background: #8e2a20; }
  /* ミニゲーム中は「ショット」が1行に収まるよう少し小さく */
  #btnA.shot { font-size: 13px; }
  /* タッチ端末: 画面上部にゲーム、下部に操作ボタンを固定したゲーム機風レイアウト
     （bodyの .touch クラスはJSでタッチ検出して付与） */
  /* 高さは JS が visualViewport（実際に見えている領域）から --app-h に入れる。
     100dvh はAndroid系でナビゲーションバーの分を含んだ値を返すことがあり、
     下段のボタンがバーの裏に隠れてしまうため当てにしない（dvhは非対応時の保険）。 */
  /* html側の上下中央寄せが残っていると、縮めたbodyごと下へ押し出されて
     操作ボタンが画面外に出る。タッチ時は通常のブロックに戻す。 */
  html.touch {
    display: block;
    height: var(--app-h, 100dvh);
    min-height: 0;
    overflow: hidden;
  }
  body.touch {
    justify-content: flex-start;
    height: var(--app-h, 100dvh);
    min-height: 0;
    box-sizing: border-box;   /* padding込みで高さを収める */
    padding-top: 10px;
    overflow: hidden;
  }
  /* ゲーム画面は縮んでよい／操作ボタンは絶対に縮めない */
  body.touch #game-wrap { flex: 0 1 auto; min-height: 0; }
  body.touch #game-wrap canvas { max-height: 100%; object-fit: contain; }
  body.touch #pad { flex: 0 0 auto; }
  body.touch #pad {
    display: flex;
    box-sizing: border-box;   /* padding込みの幅にしないと左右のボタンが画面外に出る */
    margin-top: auto;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    width: 100%;
    background: #24202c;
    border-top: 1px solid #3a3442;
  }
  body.touch #dpad {
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
  }
  body.touch .pbtn { font-size: 24px; }
  body.touch #btnA { width: 84px; height: 84px; font-size: 20px; }
  body.touch #btnA.shot { font-size: 15px; }
  body.touch #hint { display: none; }

  /* ---------- 導入演出：黒画面のタイトル → モザイクが解けて楽屋へ ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 100; background: #000;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .7s ease;
  }
  #intro .in-title {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: clamp(1.2rem, 5.5vw, 2rem); font-weight: 700;
    letter-spacing: .24em; color: #F4EDDD; text-indent: .24em;
    opacity: 0; animation: in-fade .7s ease forwards;
  }
  @keyframes in-fade { to { opacity: 1 } }
  #intro.go { opacity: 0; pointer-events: none }
  #intro.done { display: none }
</style>
</head>
<body>
<div id="intro"><span class="in-title">BACKSTAGE TOUR</span></div>

<div id="game-wrap">
  <canvas id="game" width="256" height="176"></canvas>
</div>
<div id="hint">矢印キー / WASD で移動、メンバーに近づいて <b>Z</b> か <b>スペース</b> で話しかける</div>
<div id="pad">
  <div id="dpad">
    <div></div><button class="pbtn" data-dir="up">▲</button><div></div>
    <button class="pbtn" data-dir="left">◀</button><div></div><button class="pbtn" data-dir="right">▶</button>
    <div></div><button class="pbtn" data-dir="down">▼</button><div></div>
  </div>
  <button id="btnA">話す</button>
</div>
<script>
  // タッチ端末なら下部固定の操作ボタンを表示
  if (matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0 || 'ontouchstart' in window) {
    document.body.classList.add('touch');
    document.documentElement.classList.add('touch');
  }
  // 実際に見えている高さを --app-h に反映する。
  // URLバーの出入りやナビゲーションバーの有無で変わるので、変化のたびに測り直す。
  (function fitViewport() {
    const vv = window.visualViewport;
    const apply = () => {
      const h = vv ? vv.height : window.innerHeight;
      document.documentElement.style.setProperty('--app-h', Math.round(h) + 'px');
    };
    apply();
    if (vv) { vv.addEventListener('resize', apply); vv.addEventListener('scroll', apply); }
    window.addEventListener('resize', apply);
    window.addEventListener('orientationchange', () => setTimeout(apply, 250));
  })();
</script>
<script src="shooter.js?v=20260730a"></script>
<script src="photos.js?v=20260729e"></script>
<script src="game.js?v=20260730a"></script>
</body>
</html>
